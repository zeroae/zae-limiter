# Codecov configuration.
#
# ci-tests.yml runs only on paths matching the `pull_request` `paths:` filter in
# .github/workflows/ci-tests.yml, so a docs-only PR uploads just the `doctest`
# flag. Without carryforward, Codecov compares that single ~30% report against
# a base built from all four flags (~93%) and reports a spurious coverage drop
# on codecov/project (issue #452). Carryforward reuses the most recent upload
# of each missing flag from the base commit instead.
#
# The flip side: carryforward cannot distinguish "this job did not run" from
# "this job ran and produced nothing", so a flag that goes missing for any other
# reason is silently backfilled from a commit that predates the PR's new lines,
# and genuinely-covered lines are scored as missed. Every coverage upload step
# must therefore run even when its tests fail — hence the `if: "!cancelled()"`
# on each one. See issue #494 for the failure this caused on PR #493.
flag_management:
  individual_flags:
    - name: unit
      carryforward: true
    - name: integration
      carryforward: true
    - name: e2e
      carryforward: true
    - name: doctest
      carryforward: true
