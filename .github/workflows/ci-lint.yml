name: Lint

on:
  push:
    branches:
      - main
      - 'release/v*'
      - 'release/[0-9]*'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - 'release/v*'
      - 'release/[0-9]*'
      - 'milestone/v*'
      - 'milestone/[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install ruff (needed by verify-sync-generated hook)
        # Must match the pin in pyproject.toml and .pre-commit-config.yaml, or CI
        # generates the sync twins with one formatter and checks them with another
        # (#486). The check-ruff-pin hook guards the other three declarations.
        run: pip install ruff==0.16.6
      - uses: pre-commit/action@v3.0.1
