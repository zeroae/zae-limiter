name: AWS E2E Reaper

# Deletes zci-* test stacks older than a cutoff from the e2e account (#189). Every
# AWS test deletes its own stacks and every aws-e2e run sweeps up after itself;
# this catches the rest (a killed runner, a cancelled job, a local run with
# ZAEL_E2E_STACK_PREFIX=zci-). The cutoff is at least a day, far beyond the e2e
# job's 90-minute timeout, so it never deletes a stack a live run still owns.

on:
  schedule:
    - cron: '17 7 * * *'  # daily, 07:17 UTC
  workflow_dispatch:
    inputs:
      older-than-days:
        description: 'Delete zci-* stacks created more than this many days ago (at least 1)'
        type: number
        default: 1
      dry-run:
        description: 'List the stacks without deleting them'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: aws-e2e-reaper
  cancel-in-progress: false

jobs:
  reap:
    runs-on: ubuntu-latest
    environment: aws-e2e
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      OLDER_THAN_DAYS: ${{ inputs.older-than-days || 1 }}
      DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
    steps:
      - name: Refuse a cutoff below one day
        run: |
          if ! awk -v d="$OLDER_THAN_DAYS" 'BEGIN { exit !(d >= 1) }'; then
            echo "::error::older-than-days must be at least 1 (got $OLDER_THAN_DAYS): a shorter cutoff could delete a live run's stacks"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Set up Python
        run: uv python install 3.12
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_E2E_ROLE_ARN }}
          role-session-name: zae-limiter-reaper-${{ github.run_id }}
          aws-region: us-east-1
      - name: Delete old zci-* stacks
        # Only boto3 is needed; --no-project keeps the job from installing the package.
        run: |
          # shellcheck disable=SC2086
          uv run --no-project --with boto3 python scripts/reap_e2e_stacks.py \
            --older-than-days "$OLDER_THAN_DAYS" $DRY_RUN
