name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  verify-tag:
    # Release tags are annotated (they record who tagged, when and why, and
    # plain `git describe` sees only annotated tags). v0.16.0 went out as a
    # lightweight tag because nothing checked; refuse before building.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require an annotated tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          type="$(git cat-file -t "refs/tags/${TAG}")"
          if [ "${type}" != "tag" ]; then
            echo "::error::${TAG} is a ${type}, not an annotated tag. Delete it and re-tag with:"
            echo "::error::git tag -a ${TAG} <release-prep-commit> -m \"${TAG}: <theme>\""
            exit 1
          fi
          echo "${TAG} is an annotated tag."

  build:
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Set up Python
        run: uv python install 3.12
      - name: Build package
        run: uv build
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "Release ${{ github.ref_name }}" \
            --notes-file CHANGELOG.md \
            dist/*
